# =============================================================================
# ESPnet2 Training Config — Joint CTC/Attention Conformer Baseline
# Project: Combined CTC/Attention Streaming Decoding for Subtitles
#
# Stage: OFFLINE BASELINE (no streaming)
# Dataset: LibriSpeech 960h (train-clean-100 for quick dev runs)
# Target WER: ~3-4% on test-clean (competitive offline baseline)
#
# After this baseline is solid, swap encoder → ChunkConformer (see README).
# =============================================================================

seed: 2023
num_workers: 4

# ---------------------------------------------------------------------------
# Encoder — standard Conformer (causal=false for offline baseline)
# To go streaming: set chunk_size and set causal=true in a second config.
# ---------------------------------------------------------------------------
encoder: conformer
encoder_conf:
    output_size: 256
    attention_heads: 4
    linear_units: 2048
    num_blocks: 12
    dropout_rate: 0.1
    positional_dropout_rate: 0.1
    attention_dropout_rate: 0.0
    input_layer: conv2d          # 4x subsampling; input 80-dim fbank → 256-dim
    normalize_before: true
    macaron_style: true          # FFN-MHA-Conv-FFN sandwich (original Conformer)
    rel_pos_type: latest
    pos_enc_layer_type: rel_pos
    selfattn_layer_type: rel_selfattn
    activation_type: swish
    use_cnn_module: true
    cnn_module_kernel: 31        # ~310ms context at 10ms frame shift — keep odd

# ---------------------------------------------------------------------------
# Decoder — standard Transformer with cross-attention over encoder output
# ---------------------------------------------------------------------------
decoder: transformer
decoder_conf:
    attention_heads: 4
    linear_units: 2048
    num_blocks: 6
    dropout_rate: 0.1
    positional_dropout_rate: 0.1
    self_attention_dropout_rate: 0.0
    src_attention_dropout_rate: 0.0

# ---------------------------------------------------------------------------
# Joint model
#   ctc_weight controls the CTC loss share during training.
#   At inference, this is separately controlled in decode_asr.yaml.
#   0.3 = 30% CTC loss + 70% CE loss — standard for Conformer.
# ---------------------------------------------------------------------------
model_conf:
    ctc_weight: 0.3
    lsm_weight: 0.1              # Label smoothing — reduces overconfidence
    length_normalized_loss: false

# ---------------------------------------------------------------------------
# Frontend — 80-dim log-Mel filterbank (standard for LibriSpeech)
# ---------------------------------------------------------------------------
frontend: default
frontend_conf:
    n_fft: 512
    win_length: 400              # 25ms window at 16kHz
    hop_length: 160              # 10ms frame shift at 16kHz

# ---------------------------------------------------------------------------
# SpecAugment — aggressive masking following Park et al. 2019
# For subtitle data, tune time_mask_width_ratio to match average utterance len
# ---------------------------------------------------------------------------
specaug: specaug
specaug_conf:
    apply_time_warp: true
    time_warp_window: 5
    time_warp_mode: bicubic
    apply_freq_mask: true
    freq_mask_width_range:
        - 0
        - 27                     # ≤27 freq bins masked (27/80 ≈ 34%)
    num_freq_mask: 2
    apply_time_mask: true
    time_mask_width_ratio_range:
        - 0.0
        - 0.05                   # Up to 5% of utterance masked per mask
    num_time_mask: 5

# ---------------------------------------------------------------------------
# Global MVN normalizer — compute stats first with asr_train.py --collect_stats
# ---------------------------------------------------------------------------
normalize: global_mvn
normalize_conf:
    stats_file: exp/asr_stats_raw_en_bpe5000/train/feats_stats.npz

# ---------------------------------------------------------------------------
# Tokenizer — 5000 BPE units (standard LibriSpeech setup)
# Generated by run.sh stage 4 using SentencePiece.
# ---------------------------------------------------------------------------
token_type: bpe
bpemodel: data/en_token_list/bpe_unigram5000/bpe.model

# ---------------------------------------------------------------------------
# Optimizer — Adam with warmup LR schedule (Transformer-style)
# ---------------------------------------------------------------------------
optim: adam
optim_conf:
    lr: 0.002
    weight_decay: 0.000001
scheduler: warmuplr
scheduler_conf:
    warmup_steps: 25000

# ---------------------------------------------------------------------------
# Training loop
#   batch_bins: ~35M features per batch — reduce if OOM on ≤16GB GPU
#   accum_grad: simulates 3x larger batch via gradient accumulation
#   use_amp: FP16 mixed precision — ~2x speedup, small WER cost
# ---------------------------------------------------------------------------
batch_type: numel
batch_bins: 35000000
accum_grad: 3
max_epoch: 70
patience: none
init: none

best_model_criterion:
    - - valid
      - acc
      - max
keep_nbest_models: 10
use_amp: true
ngpu: 1                          # Increase to 4/8 for multi-GPU DDP training
